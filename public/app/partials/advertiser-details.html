<div class="container-fluid">
    <div class="row">
        <div class="col-md-12">
            <h2>{{isEdit ? 'Edit' : 'New'}} Advertiser</h2>

            <div ng-if="loading" class="text-center">
                <i class="fa fa-spinner fa-spin fa-3x"></i>
                <p>Loading...</p>
            </div>

            <form ng-if="!loading" name="advertiserForm" ng-submit="saveAdvertiser()" novalidate>
                <div class="panel panel-default">
                    <div class="panel-heading">
                        <h4>Advertiser Information</h4>
                    </div>
                    <div class="panel-body">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group"
                                    ng-class="{'has-error': advertiserForm.name.$invalid && advertiserForm.name.$touched}">
                                    <label for="name">Company Name *</label>
                                    <input type="text" class="form-control" id="name" name="name"
                                        ng-model="advertiser.name" required placeholder="e.g., Pepsi">
                                    <span class="help-block"
                                        ng-if="advertiserForm.name.$invalid && advertiserForm.name.$touched">
                                        Company name is required
                                    </span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="contactName">Contact Person</label>
                                    <input type="text" class="form-control" id="contactName"
                                        ng-model="advertiser.contactName" placeholder="e.g., John Doe">
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="contactEmail">Contact Email</label>
                                    <input type="email" class="form-control" id="contactEmail"
                                        ng-model="advertiser.contactEmail" placeholder="e.g., john@pepsi.com">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="contactPhone">Contact Phone</label>
                                    <input type="tel" class="form-control" id="contactPhone"
                                        ng-model="advertiser.contactPhone" placeholder="e.g., +1-555-0123">
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label>
                                        <input type="checkbox" ng-model="advertiser.active"> Active
                                    </label>
                                    <p class="help-block">Only active advertisers will have their ads displayed</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>


                <div class="panel panel-default">
                    <div class="panel-body">
                        <button type="submit" class="btn btn-primary btn-lg" ng-disabled="advertiserForm.$invalid">
                            <i class="glyphicon glyphicon-save"></i>
                            {{isEdit ? 'Update' : 'Create'}} Advertiser
                        </button>
                        <button type="button" class="btn btn-default btn-lg" ng-click="cancel()">
                            <i class="glyphicon glyphicon-remove"></i>
                            Cancel
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
